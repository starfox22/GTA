    <div id="transitOverlay" class="overlay hidden">
      <section
        id="transitPanel"
        class="transit-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="transitTitle"
      >
        <p class="transit-kicker">SOUTH COAST RAIL · FREE CITY SERVICE</p>

      </section>
