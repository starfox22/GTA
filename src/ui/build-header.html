  src/*.js (this file's subsystems), vendor/three.r160.js, assets/ (decoded

AUDIT CONTRACTS
- Game fragments share one closure; 3D fragments share createCityRenderer(), which
  reads game state but never changes game rules.
- Map x/y becomes Three.js (x, elevation, y); heading a is radians, yaw is -a.
- Street columns are ROAD_CENTERS, rows are ROAD_ROWS; rows run negative north of
  the old shoreline. Block indices keep their pre-reclamation meaning. The x = 128
  column is the Shore Line's corridor (RAIL_CORRIDOR_X), not a street.
- 8 world units = 1 metre (UNITS_PER_METRE); a 512-unit city block is 64 m. Timers use seconds; frame timestamps use ms.
- Physics uses 1/120-second steps; terrain uses shared Float32 triangles.
- Compact entity keys (hp, a, vx/vy, w/l, hx/hy, sinkDepth) are data contracts.
- entityElevation() is the only way to compare heights across terrain, roofs,
  decks, sinking cars, boats and aircraft. Aircraft altitude is absolute;
  aircraftClearance() measures from the ground, or from the flat roof under a
  helicopter (c.roofSite).
- The player is in one carrier at a time and they are mutually exclusive: car,
  roof (the Blue Hour terrace), buildingRoof (a roof reached by helicopter), deck
  (the superyacht or a liner), parachute, coaster, transitRide, taxiRide, and the
  water (swimming, wading, climbing a ladder). Use teleportPlayer() to move the
  player: it lets go of whichever one is holding them.
- solid(x, y, r, overWater) is the one collision test; the fourth argument exists
  so the player can swim and is passed by nothing but moveBody(), on foot. On
  foot the sea is entered only from a beach (shoreStepBlocked, water.js).
- People take damage through ballisticDamage() (armour, lethality); vehicles
  through damageVehicle(), whose `detail` shapes the dent (damage.js).
- Cameras: orthographic on the street, perspective in the air (flight-view3d.js).
  Cull and pick level of detail with viewCenter, viewReach and viewZoom, not
  cameraTarget/worldZoom. Nothing lays a uniform wash over the frame. A roof
  over the player (and only a roof) gets a small dithered hole round them
  (lighting3d.js, CUTAWAY); nothing else is ever faded or cut.
- Browser localStorage holds campaign/audio/graphics settings; there is no server.
- window.DeadEndCity (end of src/game.js) is the only test surface: explicit named
  methods, never a code-evaluation hook.
- Media blocks name original paths, byte counts and SHA-256 hashes.
